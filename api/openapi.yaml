openapi: 3.0.3
info:
  title: go-template API
  version: 0.1.0
  description: Schema-first API definition for go-template.
servers:
  - url: http://localhost:8080
paths:
  /:
    get:
      operationId: getRandomUser
      summary: Get a random user
      responses:
        '200':
          description: A random user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    User:
      type: object
      required: [id, name, email, created_at, updated_at]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Alice
        email:
          type: string
          format: email
          example: alice@example.com
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Internal Server Error
