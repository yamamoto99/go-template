root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ./app/cmd"
  bin = "./tmp/main"
  include_ext = ["go"]
  exclude_dir = ["tmp", "vendor", "db", ".devcontainer", ".vscode"]
  exclude_regex = ["_test\\.go$"]
  delay = 1000
  stop_on_error = true
  kill_delay = "1s"

[log]
  time = false

[misc]
  clean_on_exit = true
